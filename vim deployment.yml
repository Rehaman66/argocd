apiVersion: apps/v1
kind: Deployment
metadata:
  name: deploy
spec:
  replicas: 3
  selector:
    matchLabels:
       app: swiggy
  template:
    metadata:
      labels:
        app: swiggy
    spec:
      containers:
         - name: cont-1
           image: shaikmustafa/dm
           ports:
             - containerPort: 80
